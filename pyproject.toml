[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "anomaly_detection"
version = "0.1.0"
requires-python = ">=3.7"

dependencies = [
    "numpy",
    "pydantic",
    "scikit-learn",
    "torch",
    "joblib",
]

[project.optional-dependencies]
train = [
    "hydra-core",
    "mlflow",
    "pandas",
    "optuna",
]

dev = [
    "pytest",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

model_space:
  encoder_dims:
    - name: enc1
      type: int
      low: 16
      high: 64

    - name: enc2
      type: int
      low: 4
      high: 32

  decoder_dims:
    - name: dec1
      type: int
      low: 16
      high: 64


training_space:
  optimizer:
    name:
      choices: [adam, sgd]

    params:
      lr:
        name: optimizer.lr
        type: float
        low: 1e-4
        high: 1e-2
        log: true

      betas:
        type: categorical
        choices:
          - [0.9, 0.999]
          - [0.5, 0.999]

      momentum:
        type: float
        low: 0.0
        high: 0.9


  epochs:
    name: epochs
    type: int
    low: 5
    high: 20

  batch_size:
    name: batch_size
    type: categorical
    choices: [32, 64]

